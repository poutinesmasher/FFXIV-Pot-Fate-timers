<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FFXIV POT FATE Timers</title>
  <link rel="icon" href="./favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <header>
    <h1>FFXIV POT FATE Timers</h1>
    <div id="eorzea-time">ET: 00:00</div>
  </header>

  <div class="input-container">
    <label for="instanceInput"> You can paste shared info here or enter a name to identify your instance </label>
    <br>
    <input type="text" class="instanceInput" id="instanceInput" placeholder="Enter shared infos / instance name">
    <div>
      <label for="positionInput">Select Position:</label>
      <select id="positionInput">
        <option>North</option>
        <option>South</option>
      </select>
      <label for="zoneInput">Zone:</label>
      <select id="zoneInput">
        <option>South Horn</option>
        <option>North Horn</option>
      </select>
    </div>

    <button onclick="addTimer()" style="padding:6px 12px;font-size:0.9rem;">Add Timer</button>
  </div>

  <div id="notification-popup" style="display:none;">
    <p id="notification-message"></p>
  </div>
  <details style="margin:10px 0;width:320px;display: flex;flex-direction: column;align-items: center;">
    <summary style="margin:10px 0;cursor:pointer;font-weight:bold;text-align: center;">Import / Export Multiple Timers
    </summary>
    <br>
    <div class="input-container" style="width: fit-content;">
      <textarea id="jsonArea"
        style="width: 700px; height:120px; background:var(--bg-color); color:var(--text-color); border:1px solid var(--text-color);"></textarea>
      <button onclick="exportToTextarea()">Export to Clipboard</button>
      <button onclick="importFromTextarea()">Import from Textarea</button>
    </div>
  </details>
  <div id="timers"></div>

<details id="southHornMap" style="margin:20px auto; max-width:820px;">
    <summary style="cursor:pointer;font-weight:bold;">
        🗺️ South Horn Pot Map
    </summary>

    <img
        src="./800px-South_Horn_Pot_Coffers_Color_Coded.jpg"
        alt="South Horn Pot Coffers"
        width="800"
        style="max-width:100%;height:auto;display:block;margin:10px auto;">

    <div style="text-align:center;">
        <a class="whiteLink"
           href="https://consolegameswiki.com/wiki/Persistent_Pot"
           target="_blank">
            Map source
        </a>
    </div>
</details>

<details id="northHornMap" style="margin:20px auto; max-width:820px;">
    <summary style="cursor:pointer;font-weight:bold;">
        🗺️ North Horn Pot Map
    </summary>

    <img
        src="./800px-North_Horn_Pot_Coffers.jpg"
        alt="North Horn Pot Coffers"
        width="800"
        style="max-width:100%;height:auto;display:block;margin:10px auto;">

    <div style="text-align:center;">
        <a class="whiteLink"
           href="https://consolegameswiki.com/wiki/Persistent_Pot"
           target="_blank">
            Map source
        </a>
    </div>
</details>

  <button id="muteToggle" onclick="toggleMute()">🔊 Sound On</button>
  <button id="themeToggle" onclick="toggleTheme()">Toggle Day/Night Theme</button>
  <script>
    const FATE_DURATION = 1800;
    let timers = {};
    let soundMuted = JSON.parse(localStorage.getItem('soundMuted') || 'false');

    function playAlertSound() {
      if (soundMuted) return;

      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();

      o.type = 'sine';
      o.frequency.value = 880;
      o.connect(g);
      g.connect(ctx.destination);

      g.gain.setValueAtTime(0.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);

      o.start();
      o.stop(ctx.currentTime + 0.6);
    }

    function toggleMute() {
      soundMuted = !soundMuted;
      localStorage.setItem('soundMuted', JSON.stringify(soundMuted));
      document.getElementById('muteToggle').textContent =
        soundMuted ? '🔇 Sound Off' : '🔊 Sound On';
    }

    (function () {
      const btn = document.getElementById('muteToggle');
      if (btn) {
        btn.textContent = soundMuted ? '🔇 Sound Off' : '🔊 Sound On';
      }
    })();

    function updateEorzeaTime() {
      const now = Date.now();
      const eMillis = now * 20.5714285714;
      const e = new Date(eMillis);
      const h = String(e.getUTCHours()).padStart(2, '0');
      const m = String(e.getUTCMinutes()).padStart(2, '0');
      document.getElementById('eorzea-time').textContent = `ET: ${h}:${m}`;
    }
    setInterval(updateEorzeaTime, 1000);
    updateEorzeaTime();

    function formatTime(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
    function positionLabel(p) { return p + " -"; }

    function saveTimers() {
      const out = {};
      for (const id in timers) {
        const t = timers[id];
        out[id] = {
          name: t.name,
          zone: t.zone,
          position: t.position,
          endTime: t.endTime || null,
          running: t.running
        };
      }
      localStorage.setItem("fateTimers", JSON.stringify(out));
    }

    function loadTimers() {
      const saved = localStorage.getItem("fateTimers");
      if (!saved) return;
      const data = JSON.parse(saved);
      for (const id in data) {
        const d = data[id];
        let remaining = FATE_DURATION;
        if (d.endTime && d.running) { remaining = Math.max(0, Math.floor((d.endTime - Date.now()) / 1000)); }
        createTimerElement(
          id,
          d.name,
          d.zone || "South Horn",
          d.position || "North",
          remaining,
          d.running
        );
      }
    }

    function updateDisplay(id) {
      const t = timers[id];
      const disp = document.getElementById(`display-${id}`);
      const box = document.getElementById(`timer-${id}`);
      if (!disp) return;
      disp.textContent =
        `${t.zone} • ${positionLabel(t.position)} ${formatTime(t.remaining)}`;
      if (t.remaining <= 300) box.classList.add("warning"); else box.classList.remove("warning");
    }

    function startTimer(id) {
      const t = timers[id];
      if (t.interval) clearInterval(t.interval);
      t.running = true;
      t.endTime = Date.now() + t.remaining * 1000;
      t.interval = setInterval(() => {
        t.remaining = Math.max(0, Math.floor((t.endTime - Date.now()) / 1000));
        updateDisplay(id);
        if (t.remaining <= 0) {
          clearInterval(t.interval);
          t.running = false;
          playAlertSound();
          showNotification(`Pots in ${t.position} "${t.name}" should have respawned!`);
          swapPosition(id, true);
          startNewCycle(id);
        }
        saveTimers();
      }, 1000);
      updateDisplay(id); saveTimers();
    }

    function stopTimer(id) {
      const t = timers[id];
      if (t.interval) clearInterval(t.interval);
      t.running = false;
      t.interval = null;
      t.endTime = null;
      saveTimers();
    }

    function adjustTimer(id, delta) {
      const t = timers[id];
      t.remaining = Math.max(0, t.remaining + delta);
      if (t.running) { t.endTime = Date.now() + t.remaining * 1000; }
      updateDisplay(id);
      saveTimers();
    }

    function startNewCycle(id) {
      const t = timers[id];
      t.remaining = FATE_DURATION;
      t.endTime = Date.now() + FATE_DURATION * 1000;
      t.running = true;
      updateDisplay(id);
      saveTimers();
      startTimer(id);
    }

    function swapPosition(id, save = true) {
      const t = timers[id];
      t.position = t.position === "North" ? "South" : "North";
      if (save) { updateDisplay(id); saveTimers(); }
    }

    function resetTimer(id) {
      const t = timers[id];
      clearInterval(t.interval);
      t.remaining = FATE_DURATION;
      t.endTime = null;
      t.running = false;
      updateDisplay(id);
      saveTimers();
      startTimer(id);
    }

    function deleteTimer(id) {
      const t = timers[id];
      clearInterval(t?.interval);
      delete timers[id];
      document.getElementById(`timer-${id}`)?.remove();
      saveTimers();
    }

    function renameTimer(id, n) { timers[id].name = n.trim(); saveTimers(); }

    function createTimerElement(id, name, zone, pos, remaining, run) {
      const box = document.createElement("div");
      box.className = "timer-container";
      box.id = `timer-${id}`;
      box.innerHTML = `
         <input class="timer-title" id="title-${id}" value="${name}" onchange="renameTimer('${id}',this.value)">
                 

         <div id="display-${id}" class="timer-display">${zone} • ${positionLabel(pos)} ${formatTime(remaining)}</div>
         <button onclick="startTimer('${id}')">Start</button>
         <button onclick="stopTimer('${id}')">Stop</button>
         <button onclick="resetTimer('${id}')">Reset</button><br>
         <button onclick="swapPosition('${id}')">Toggle Position</button>
         <button onclick="linkTimer('${id}')">Share Timer</button><br>
         <button onclick="adjustTimer('${id}',60)">+1 min</button>
         <button onclick="adjustTimer('${id}',-60)">-1 min</button><br>
         <button onclick="adjustTimer('${id}',5)">+5 sec</button>
         <button onclick="adjustTimer('${id}',-5)">-5 sec</button><br>
         <button onclick="deleteTimer('${id}')">Delete</button>
         `;

      document.getElementById("timers").appendChild(box);
      timers[id] = {
        name,
        zone,
        remaining,
        position: pos,
        interval: null,
        running: run,
        endTime: null
      };
      updateDisplay(id);
      if (run && remaining > 0) startTimer(id);
    }

    function linkTimer(id) {
      const t = timers[id];
      // Calculate the absolute timestamp in milliseconds
      const absoluteRespawnTime = Date.now() + (t.remaining * 1000);

      // Format: Instance Name | Position | Timestamp
      const message = `${t.name} | ${t.zone} | ${t.position} | ${absoluteRespawnTime}`;
      navigator.clipboard.writeText(message).then(() => {
        showNotification("Timer data copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }

    function addTimer() {
      let name = document.getElementById("instanceInput").value.trim();
      let pos = document.getElementById("positionInput").value;
      let zone = document.getElementById("zoneInput").value;
      let durationSeconds = FATE_DURATION;
      let shouldAutoStart = false;

      // Check if the input is a "Link" (contains the pipe '|' symbol)
      if (name.includes('|')) {
        const parts = name.split('|').map(p => p.trim());
        if (parts.length === 4) {
            name = parts[0];
            zone = parts[1];
            pos = parts[2];
            const endTime = parseInt(parts[3],10);

          const diff = Math.floor((endTime - Date.now()) / 1000);
          if (diff > 0) {
            durationSeconds = diff;
            shouldAutoStart = true;
          }
        }
      }

      if (!name) return alert("Please enter an instance name.");

      const id = "fate_" + Date.now();

      // Create the timer with the calculated duration
      createTimerElement(
          id,
          name,
          zone,
          pos,
          durationSeconds,
          shouldAutoStart
      );
      saveTimers();

      // Reset inputs
      document.getElementById("instanceInput").value = "";
    }

    function toggleTheme() {
      const t = document.body.className === "day" ? "" : "day";
      document.body.className = t;
      localStorage.setItem("theme", t);
    }
    (function () { const t = localStorage.getItem("theme"); if (t) document.body.className = t; })();

    function showNotification(msg) {
      const n = document.getElementById('notification-popup');
      const m = document.getElementById('notification-message');
      m.textContent = msg;
      n.style.display = 'block';
      setTimeout(() => n.style.opacity = '1', 10);
      setTimeout(() => {
        n.style.opacity = '0';
        setTimeout(() => n.style.display = 'none', 500);
      }, 3000);
    }

    function exportTimers() {
      const data = localStorage.getItem('fateTimers') || '{}';
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fate_timers.json';
      a.click();
    }
    function importTimers(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const json = JSON.parse(e.target.result);
          localStorage.setItem('fateTimers', JSON.stringify(json));
          location.reload();
        } catch (err) { alert('Invalid JSON: check if you copied correctly'); }
      };
      reader.readAsText(file);
    }
    function exportToTextarea() {
      document.getElementById('jsonArea').value = localStorage.getItem('fateTimers') || '{}';

      copyTextarea()
    }
    function importFromTextarea() {
      const text = document.getElementById('jsonArea').value.trim();
      try {
        const json = JSON.parse(text);
        localStorage.setItem('fateTimers', JSON.stringify(json));
        location.reload();
      } catch (e) { alert('Invalid JSON'); }
    }
    function copyTextarea() {
      const ta = document.getElementById('jsonArea');
      ta.select();
      document.execCommand('copy');
      alert('Exported to clipboard, now just paste it in chat');
    }
    loadTimers();
  </script>

</body>
